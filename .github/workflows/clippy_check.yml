name: Clippy Check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  clippy-windows:
    name: Clippy (Windows)
    runs-on: ubuntu-latest
    env:
      CFLAGS_x86_64_pc_windows_msvc: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
      CXXFLAGS_x86_64_pc_windows_msvc: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
      CFLAGS: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
      CXXFLAGS: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
    steps:
      - uses: actions/checkout@v7

      - name: Check path changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code_changed:
              - 'src/**'
              - 'assets/locales/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.github/workflows/clippy_check.yml'

      - name: Install Rust
        if: steps.filter.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.code_changed == 'true'
        with:
          prefix-key: x86_64-pc-windows-msvc

      - name: Setup Windows MSVC Cross-Compile Tools
        if: steps.filter.outputs.code_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19
          echo "/usr/lib/llvm-19/bin" >> $GITHUB_PATH
          for tool in clang clang++ clang-cl lld lld-link ld.lld llvm-ar llvm-lib; do
            if [ -f "/usr/lib/llvm-19/bin/$tool" ]; then
              sudo ln -sf "/usr/lib/llvm-19/bin/$tool" "/usr/local/bin/$tool"
            elif command -v "$tool" >/dev/null 2>&1; then
              sudo ln -sf "$(which "$tool")" "/usr/local/bin/$tool"
            fi
          done
          if [ ! -f /usr/local/bin/llvm-lib ]; then
            if [ -f /usr/lib/llvm-19/bin/llvm-ar ]; then
              sudo ln -sf /usr/lib/llvm-19/bin/llvm-ar /usr/local/bin/llvm-lib
            elif command -v llvm-ar >/dev/null 2>&1; then
              sudo ln -sf "$(which llvm-ar)" /usr/local/bin/llvm-lib
            fi
          fi

      - name: Install cargo-xwin
        if: steps.filter.outputs.code_changed == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@0.23.1

      - name: Cache cargo-xwin MSVC CRT & Windows SDK
        if: steps.filter.outputs.code_changed == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: ${{ runner.os }}-xwin-cache-v1

      - name: Run Clippy (Windows)
        if: steps.filter.outputs.code_changed == 'true'
        run: cargo xwin clippy --target x86_64-pc-windows-msvc -- -D warnings

  clippy-android:
    name: Clippy (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check path changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code_changed:
              - 'src/**'
              - 'assets/locales/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.github/workflows/clippy_check.yml'

      - name: Setup Android NDK Environment
        if: steps.filter.outputs.code_changed == 'true'
        run: |
          echo "RUSTFLAGS=-C link-args=-static-libstdc++ -C link-args=-lc++abi" >> $GITHUB_ENV
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> $GITHUB_ENV

      - name: Install Rust
        if: steps.filter.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.code_changed == 'true'
        with:
          prefix-key: aarch64-linux-android

      - name: Run Clippy (Android)
        if: steps.filter.outputs.code_changed == 'true'
        run: cargo clippy --target aarch64-linux-android -- -D warnings
